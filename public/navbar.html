<header class="top">
   <div class="wrap top__row">
      <button
         class="burger burger--drawer"
         type="button"
         data-panel="#drawer"
         aria-label="Open menu"
      >
         <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
            aria-hidden="true"
         >
            <path d="M4 7h16M4 12h16M4 17h16" />
         </svg>
      </button>

      <a class="brand" href="./index2.html">
         <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
         >
            <path
               d="M4 8h16l-1.3 11.2a1.5 1.5 0 0 1-1.5 1.3H6.8a1.5 1.5 0 0 1-1.5-1.3z"
            />
            <path d="M8.6 8V6.3a3.4 3.4 0 0 1 6.8 0V8" />
         </svg>
         <span class="brand__name">ShopEase</span>
      </a>

      <nav class="nav" aria-label="Main">
         <a href="./index2.html">Home</a>
         <a href="./wishlist.html">Wishlist</a>
         <a href="./viewOrder.html">Orders</a>
         <a href="./contact.html">Contact</a>
      </nav>

      <div class="search">
         <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
         >
            <circle cx="11" cy="11" r="6.5" />
            <path d="m16 16 4.5 4.5" />
         </svg>
         <input
            id="searchInput"
            type="search"
            placeholder="Search products"
            aria-label="Search products"
         />
      </div>

      <div class="menu">
         <button class="menu__btn" type="button" aria-label="Account menu">
            <span id="username">Account</span>
            <svg
               viewBox="0 0 24 24"
               fill="none"
               stroke="currentColor"
               stroke-width="2"
               stroke-linecap="round"
               aria-hidden="true"
            >
               <path d="m6 9.5 6 6 6-6" />
            </svg>
         </button>
         <ul class="menu__list">
            <li><a href="./profile.html" id="profileBtn">Profile</a></li>
            <li><a href="./paymentHistory.html">Payment history</a></li>
            <li>
               <a href="./logout.html" id="logoutbtn" class="is-danger"
                  >Log out</a
               >
            </li>
         </ul>
      </div>

      <a class="iconbtn" href="./cart.html" aria-label="Cart">
         <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
         >
            <path
               d="M3 5h2.2l2.2 10.2a1.5 1.5 0 0 0 1.5 1.2h8.3a1.5 1.5 0 0 0 1.5-1.1L20.5 8H6"
            />
            <circle cx="10" cy="20" r="1.2" fill="currentColor" stroke="none" />
            <circle
               cx="17.5"
               cy="20"
               r="1.2"
               fill="currentColor"
               stroke="none"
            />
         </svg>
         <span class="count" id="cartCount" hidden>0</span>
      </a>
   </div>
</header>

<aside class="drawer" id="drawer" aria-label="Menu">
   <div class="drawer__head">
      <span class="brand__name">ShopEase</span>
      <button
         class="drawer__close"
         type="button"
         data-panel-close
         aria-label="Close menu"
      >
         &times;
      </button>
   </div>
   <ul>
      <li><a href="./index2.html">Home</a></li>
      <li><a href="./wishlist.html">Wishlist</a></li>
      <li><a href="./cart.html">Cart</a></li>
      <li><a href="./viewOrder.html">Orders</a></li>
      <li><a href="./contact.html">Contact</a></li>
   </ul>
   <p class="drawer__label">Account</p>
   <ul>
      <li><a href="./profile.html">Profile</a></li>
      <li><a href="./paymentHistory.html">Payment history</a></li>
      <li><a href="./logout.html" class="is-danger">Log out</a></li>
   </ul>
</aside>
