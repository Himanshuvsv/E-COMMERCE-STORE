<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>Choose a new password — ShopEase</title>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
         href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap"
         rel="stylesheet"
      />
      <link rel="stylesheet" href="./static/css/theme.css" />
   </head>

   <body>
      <main class="centered">
         <div class="auth-card">
            <a class="auth-card__brand" href="./index.html">
               <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  width="26"
                  height="26"
                  aria-hidden="true"
                  style="color: var(--accent)"
               >
                  <path
                     d="M4 8h16l-1.3 11.2a1.5 1.5 0 0 1-1.5 1.3H6.8a1.5 1.5 0 0 1-1.5-1.3z"
                  />
                  <path d="M8.6 8V6.3a3.4 3.4 0 0 1 6.8 0V8" />
               </svg>
               <span class="brand__name">ShopEase</span>
            </a>

            <h1>Choose a new password</h1>
            <p class="auth-card__sub">
               Pick something at least six characters long.
            </p>

            <form id="ResetPasswordForm" class="auth-form">
               <div class="field">
                  <label for="newPassword">New password</label>
                  <input
                     type="password"
                     id="newPassword"
                     name="newPassword"
                     placeholder="New password"
                     autocomplete="new-password"
                     minlength="6"
                     required
                  />
               </div>
               <div class="field">
                  <label for="confirmPassword">Confirm new password</label>
                  <input
                     type="password"
                     id="confirmPassword"
                     name="confirmPassword"
                     placeholder="Repeat the new password"
                     autocomplete="new-password"
                     required
                  />
               </div>
               <button class="btn btn--block" type="submit">
                  Update password
               </button>
            </form>

            <p class="auth-card__foot">
               <a href="./login.html">Back to sign in</a>
            </p>
         </div>
      </main>

      <script src="./static/js/coman/toast.js"></script>
      <script>
         document
            .getElementById("ResetPasswordForm")
            .addEventListener("submit", async (event) => {
               event.preventDefault();

               const submit = event.target.querySelector(
                  'button[type="submit"]'
               );
               const params = new URLSearchParams(window.location.search);
               const token = params.get("token");
               const email = params.get("email");

               const newPassword = document.getElementById("newPassword").value;
               const confirmPassword =
                  document.getElementById("confirmPassword").value;

               if (newPassword !== confirmPassword) {
                  toastError("Those passwords do not match");
                  return;
               }

               submit.disabled = true;
               submit.classList.add("is-busy");

               try {
                  const response = await fetch("/api/auth/forgot-password", {
                     method: "POST",
                     headers: { "Content-Type": "application/json" },
                     body: JSON.stringify({
                        token,
                        email,
                        password: newPassword,
                     }),
                  });

                  const data = await response.json();

                  if (response.ok) {
                     toast("Password updated");
                     window.location.href = "./login.html";
                     return;
                  }

                  submit.disabled = false;
                  submit.classList.remove("is-busy");
                  toastError(data.msg || "Could not reset your password");
               } catch (error) {
                  submit.disabled = false;
                  submit.classList.remove("is-busy");
                  toastError("Something went wrong. Please try again.");
               }
            });
      </script>
   </body>
</html>
