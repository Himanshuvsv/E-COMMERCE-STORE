<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Reset Password - SHOPEASE</title>
      <link rel="stylesheet" href="./static/css/user/login.css" />
   </head>
   <body>
      <div class="container">
         <div class="header">
            <img src="./logo.jpeg" alt="Logo" />
            <h1 class="sitename">Forgot Password</h1>
         </div>
         <form id="ResetPasswordForm">
            <div class="form-group">
               <label for="newPassword">New Password</label>
               <input
                  type="password"
                  id="newPassword"
                  name="newPassword"
                  placeholder="Enter new password"
                  required
               />
            </div>
            <div class="form-group">
               <label for="confirmPassword">Confirm New Password</label>
               <input
                  type="password"
                  id="confirmPassword"
                  name="confirmPassword"
                  placeholder="Confirm new password"
                  required
               />
            </div>
            <button type="submit" class="btn">Confirm</button>
         </form>
         <div class="footer">
            <p>&copy; 2025 SHOPEASE. All rights reserved.</p>
         </div>
      </div>
      <script>
         document.getElementById("ResetPasswordForm").addEventListener("submit", async function (event) {
            event.preventDefault();
            
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get("token");
            const email = urlParams.get("email");
            
            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            
            if (newPassword !== confirmPassword) {
               alert("Passwords do not match!");
               return;
            }
            
            try {
               const response = await fetch("http://127.0.0.1:5000/api/auth/forgot-password", {
                  method: "POST",
                  headers: {
                     "Content-Type": "application/json",
                  },
                  body: JSON.stringify({ token, email, password: newPassword }),
               });
               
               const data = await response.json();
               
               if (response.ok) {
                  alert("Password reset successful!");
                  window.location.href = "./login.html"; // Redirect to login page
               } else {
                  alert(data.msg || "Password reset failed!");
               }
            } catch (error) {
               alert("An error occurred. Please try again later.");
               console.error(error);
            }
         });
      </script>
   </body>
</html>
