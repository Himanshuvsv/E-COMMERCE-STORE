<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>Orders — ShopEase Admin</title>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
         href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap"
         rel="stylesheet"
      />
      <link rel="stylesheet" href="./static/css/theme.css" />
   </head>

   <body>
      <div id="admin-header"></div>

      <div class="admin">
         <div id="admin-sidebar"></div>

         <main class="admin-main">
            <div class="head" style="padding-top: 0">
               <h1 class="head__title">Orders</h1>
               <p class="head__sub">
                  Track fulfilment and update the status of every order.
               </p>
            </div>

            <div class="bar" style="margin-top: 24px">
               <div class="chips" id="statusChips" role="group" aria-label="Filter by status">
                  <button class="chip" type="button" data-status="all" aria-pressed="true">
                     All <span id="allCount">0</span>
                  </button>
                  <button class="chip" type="button" data-status="pending" aria-pressed="false">
                     Pending <span id="pendingCount">0</span>
                  </button>
                  <button class="chip" type="button" data-status="processing" aria-pressed="false">
                     Processing <span id="processingCount">0</span>
                  </button>
                  <button class="chip" type="button" data-status="shipped" aria-pressed="false">
                     Shipped <span id="shippedCount">0</span>
                  </button>
                  <button class="chip" type="button" data-status="delivered" aria-pressed="false">
                     Delivered <span id="deliveredCount">0</span>
                  </button>
                  <button class="chip" type="button" data-status="canceled" aria-pressed="false">
                     Canceled <span id="canceledCount">0</span>
                  </button>
               </div>
               <div class="bar__right">
                  <div class="search" style="max-width: 280px">
                     <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        aria-hidden="true"
                     >
                        <circle cx="11" cy="11" r="6.5" />
                        <path d="m16 16 4.5 4.5" />
                     </svg>
                     <input
                        id="searchOrder"
                        type="search"
                        placeholder="Search by customer or ID"
                        aria-label="Search orders"
                     />
                  </div>
               </div>
            </div>

            <div class="table-wrap">
               <table class="table">
                  <thead>
                     <tr>
                        <th>Order</th>
                        <th>Customer</th>
                        <th>Items</th>
                        <th>Date</th>
                        <th>Total</th>
                        <th>Payment</th>
                        <th>Status</th>
                        <th>Actions</th>
                     </tr>
                  </thead>
                  <tbody id="orderTable">
                     <tr>
                        <td class="table__empty" colspan="8">Loading orders…</td>
                     </tr>
                  </tbody>
               </table>
            </div>
         </main>
      </div>

      <script src="./static/js/coman/api.js"></script>
      <script src="./static/js/coman/nav.js"></script>
      <script src="./static/js/coman/toast.js"></script>
      <script src="./static/js/coman/currentUser.js"></script>
      <script src="./static/js/coman/adminShell.js"></script>
      <script src="./static/js/orders/getOrders.js"></script>
   </body>
</html>
