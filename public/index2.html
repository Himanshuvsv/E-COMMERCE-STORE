<html lang="en">
   <head>
      <meta charset="utf-8" />
      <meta content="width=device-width, initial-scale=1.0" name="viewport" />
      <title>E-Commerce - user-side Interfaces</title>
      <meta name="description" content="" />
      <meta name="keywords" content="" />
      <link rel="stylesheet" href="./static/css/user/main.css" />
      <link rel="stylesheet" href="./static/css/user/cart.css" />
      <link rel="stylesheet" href="./static/css/user/popup.css" />
      <link rel="stylesheet" href="./static/css/user/reviews.css" />

      <!-- Fonts -->
      <link href="https://fonts.googleapis.com" rel="preconnect" />
      <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin />
      <link
         href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Nunito:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
         rel="stylesheet"
      />
      <link rel="stylesheet" href="./static/css/user/ui.css" />
   </head>

   <body class="index-page">
      <!-- Navbar -->
      <div
         id="navbar-container"
         class="header d-flex align-items-center fixed-top"
      ></div>

      <!-- Display products -->
      <div id="product-container"></div>

      <!-- footer -->
      <div id="footer-placeholder"></div>
      <!-- navbar -->
      <script>
         async function loadNavbar() {
            try {
               const response = await fetch("navbar.html");
               const navbarHTML = await response.text();
               document.getElementById("navbar-container").innerHTML =
                  navbarHTML;
            } catch (error) {
               console.error("Error loading navbar:", error);
            }
         }
         loadNavbar();
      </script>
      <script>
         fetch("footer.html")
            .then((response) => response.text())
            .then((data) => {
               document.getElementById("footer-placeholder").innerHTML = data;
            })
            .catch((error) => console.log("error loading footer", error));
      </script>
      <script src="./static/js/users/search.js"></script>
      <script src="./static/js/product/userProductList.js"></script>
      <script src="./static/js/users/popup.js"></script>
      <script src="./static/js/coman/currentUser.js"></script>
      <script src="./static/js/users/addToWishlist.js"></script>
   </body>
</html>
