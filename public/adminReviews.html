<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>Reviews — ShopEase Admin</title>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
         href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap"
         rel="stylesheet"
      />
      <link rel="stylesheet" href="./static/css/theme.css" />
   </head>

   <body>
      <div id="admin-header"></div>

      <div class="admin">
         <div id="admin-sidebar"></div>

         <main class="admin-main">
            <div class="head" style="padding-top: 0">
               <h1 class="head__title">Reviews</h1>
               <p class="head__sub">
                  What customers are saying about each product.
               </p>
            </div>

            <div class="bar" style="margin-top: 24px">
               <span class="resultcount" id="reviewCount"></span>
               <div class="bar__right">
                  <label class="sr-only" for="productFilter">Filter by product</label>
                  <select id="productFilter">
                     <option value="">All products</option>
                  </select>
                  <div class="search" style="max-width: 260px">
                     <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        aria-hidden="true"
                     >
                        <circle cx="11" cy="11" r="6.5" />
                        <path d="m16 16 4.5 4.5" />
                     </svg>
                     <input
                        id="reviewSearch"
                        type="search"
                        placeholder="Search reviews"
                        aria-label="Search reviews"
                     />
                  </div>
               </div>
            </div>

            <div class="table-wrap">
               <table class="table">
                  <thead>
                     <tr>
                        <th>Product</th>
                        <th>Customer</th>
                        <th>Rating</th>
                        <th>Title</th>
                        <th>Comment</th>
                     </tr>
                  </thead>
                  <tbody id="reviewsTable">
                     <tr>
                        <td class="table__empty" colspan="5">Loading reviews…</td>
                     </tr>
                  </tbody>
               </table>
            </div>
         </main>
      </div>

      <script src="./static/js/coman/api.js"></script>
      <script src="./static/js/coman/nav.js"></script>
      <script src="./static/js/coman/toast.js"></script>
      <script src="./static/js/coman/currentUser.js"></script>
      <script src="./static/js/coman/adminShell.js"></script>
      <script>
         const apiBase = "/api/reviews";
         let allReviews = [];

         function starRating(rating) {
            let stars = "";
            for (let i = 1; i <= 5; i++) {
               stars += `<span style="color:${
                  i <= rating ? "#D9930B" : "#C7CEC6"
               };font-size:15px">${i <= rating ? "★" : "☆"}</span>`;
            }
            return `<span class="nowrap">${stars}</span>`;
         }

         function renderReviews() {
            const body = document.getElementById("reviewsTable");
            const count = document.getElementById("reviewCount");
            const query = (
               document.getElementById("reviewSearch").value || ""
            )
               .trim()
               .toLowerCase();

            const rows = allReviews.filter((review) => {
               if (!query) return true;
               return (
                  String(review.title || "").toLowerCase().includes(query) ||
                  String(review.comment || "").toLowerCase().includes(query) ||
                  String(review.user ? review.user.name : "")
                     .toLowerCase()
                     .includes(query)
               );
            });

            count.textContent =
               rows.length + (rows.length === 1 ? " review" : " reviews");

            if (!rows.length) {
               body.innerHTML =
                  '<tr><td class="table__empty" colspan="5">No reviews to show.</td></tr>';
               return;
            }

            body.innerHTML = rows
               .map(
                  (review) => `
               <tr>
                  <td data-label="Product">
                     <span class="cell-product">
                        <img src="${review.product.image}" alt="${
                     review.product.name
                  }">
                        <strong style="color:var(--ink)">${
                           review.product.name
                        }</strong>
                     </span>
                  </td>
                  <td data-label="Customer">${
                     review.user ? review.user.name : "Anonymous"
                  }</td>
                  <td data-label="Rating">${starRating(review.rating)}</td>
                  <td data-label="Title">${review.title}</td>
                  <td data-label="Comment"><span class="muted">${
                     review.comment
                  }</span></td>
               </tr>`
               )
               .join("");
         }

         async function fetchReviews() {
            try {
               const response = await fetch(apiBase);
               const data = await response.json();
               allReviews = data.reviews || [];
               renderReviews();
            } catch (error) {
               document.getElementById("reviewsTable").innerHTML =
                  '<tr><td class="table__empty" colspan="5">Could not load reviews.</td></tr>';
            }
         }

         async function fetchProductReviews() {
            const productId = document.getElementById("productFilter").value;
            if (!productId) return fetchReviews();

            try {
               const response = await fetch(`${apiBase}/product/${productId}`);
               const data = await response.json();
               allReviews = data.reviews || [];
               renderReviews();
            } catch (error) {
               toastError("Could not load reviews for that product");
            }
         }

         async function loadProductOptions() {
            try {
               const response = await fetch("/api/products");
               const data = await response.json();
               const filter = document.getElementById("productFilter");

               (data.products || []).forEach((product) => {
                  const option = document.createElement("option");
                  option.value = product._id;
                  option.textContent = product.name;
                  filter.appendChild(option);
               });
            } catch (error) {
               /* the filter stays on "All products" */
            }
         }

         document.addEventListener("DOMContentLoaded", () => {
            document
               .getElementById("productFilter")
               .addEventListener("change", fetchProductReviews);

            let timer = null;
            document
               .getElementById("reviewSearch")
               .addEventListener("input", () => {
                  clearTimeout(timer);
                  timer = setTimeout(renderReviews, 180);
               });

            fetchReviews();
            loadProductOptions();
         });
      </script>
   </body>
</html>
