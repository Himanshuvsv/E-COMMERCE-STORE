<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>ShopEase — Furniture</title>
      <meta
         name="description"
         content="Solid wood furniture for the home office and dining room."
      />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
         href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap"
         rel="stylesheet"
      />
      <link rel="stylesheet" href="./static/css/theme.css" />
   </head>

   <body>
      <div id="navbar-container" data-src="guestNav.html"></div>

      <main class="wrap page">
         <div class="head">
            <h1 class="head__title">Furniture for the way you work and eat</h1>
            <p class="head__sub">
               Solid wood pieces for the home office and dining room. Free
               delivery over $250, and 30 days to change your mind.
            </p>
         </div>

         <div class="bar">
            <div class="chips" id="chips" role="group" aria-label="Filter by category">
               <button class="chip" type="button" data-cat="" aria-pressed="true">
                  All
               </button>
               <button class="chip" type="button" data-cat="office" aria-pressed="false">
                  Office
               </button>
               <button class="chip" type="button" data-cat="kitchen" aria-pressed="false">
                  Kitchen
               </button>
               <button class="chip" type="button" data-cat="bedroom" aria-pressed="false">
                  Bedroom
               </button>
            </div>
            <div class="bar__right">
               <span class="resultcount" id="resultCount"></span>
               <label class="sr-only" for="sort">Sort products</label>
               <select id="sort">
                  <option value="featured">Featured</option>
                  <option value="low">Price: low to high</option>
                  <option value="high">Price: high to low</option>
                  <option value="rating">Top rated</option>
               </select>
            </div>
         </div>

         <ul class="grid" id="product-container"></ul>
      </main>

      <div id="footer-placeholder"></div>

      <script src="./static/js/coman/nav.js"></script>
      <script src="./static/js/coman/toast.js"></script>
      <script src="./static/js/coman/shell.js"></script>
      <script src="./static/js/product/productCard.js"></script>
      <script src="./static/js/users/search.js"></script>
      <script src="./static/js/product/guestProduct.js"></script>
   </body>
</html>
