<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>Sign in — ShopEase</title>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
         href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap"
         rel="stylesheet"
      />
      <link rel="stylesheet" href="./static/css/theme.css" />
   </head>

   <body>
      <main class="centered">
         <div class="auth-card">
            <a class="auth-card__brand" href="./index.html">
               <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  width="26"
                  height="26"
                  aria-hidden="true"
                  style="color: var(--accent)"
               >
                  <path
                     d="M4 8h16l-1.3 11.2a1.5 1.5 0 0 1-1.5 1.3H6.8a1.5 1.5 0 0 1-1.5-1.3z"
                  />
                  <path d="M8.6 8V6.3a3.4 3.4 0 0 1 6.8 0V8" />
               </svg>
               <span class="brand__name">ShopEase</span>
            </a>

            <h1>Welcome back</h1>
            <p class="auth-card__sub">Sign in to continue shopping.</p>

            <form id="LoginForm" class="auth-form">
               <div class="field">
                  <label for="username">Email</label>
                  <input
                     type="email"
                     id="username"
                     name="username"
                     placeholder="you@example.com"
                     autocomplete="email"
                     required
                  />
               </div>
               <div class="field">
                  <label for="password">Password</label>
                  <input
                     type="password"
                     id="password"
                     name="password"
                     placeholder="Your password"
                     autocomplete="current-password"
                     required
                  />
               </div>
               <button class="btn btn--block" type="submit">Sign in</button>
            </form>

            <p class="auth-card__foot">
               <a href="./sendPasswordForgotEmail.html">Forgot your password?</a>
            </p>
            <p class="auth-card__foot" style="margin-top: 6px">
               New here? <a href="./register.html">Create an account</a>
            </p>
         </div>
      </main>

      <script src="./static/js/coman/api.js"></script>
      <script src="./static/js/coman/toast.js"></script>
      <script>
         document
            .getElementById("LoginForm")
            .addEventListener("submit", async (event) => {
               event.preventDefault();

               const submit = event.target.querySelector(
                  'button[type="submit"]'
               );
               const email = document.getElementById("username").value;
               const password = document.getElementById("password").value;

               submit.disabled = true;
               submit.classList.add("is-busy");

               try {
                  const response = await fetch("/api/auth/login", {
                     method: "POST",
                     headers: { "Content-Type": "application/json" },
                     body: JSON.stringify({ email, password }),
                  });

                  const data = await response.json();

                  if (response.ok) {
                     setToken(data.token);
                     toast("Signed in");
                     window.location.href =
                        data.user.role === "admin"
                           ? "dashboard.html"
                           : "index2.html";
                     return;
                  }

                  submit.disabled = false;
                  submit.classList.remove("is-busy");
                  toastError(data.msg || data.error || "Invalid credentials");
               } catch (error) {
                  submit.disabled = false;
                  submit.classList.remove("is-busy");
                  toastError("Something went wrong. Please try again.");
               }
            });
      </script>
   </body>
</html>
