<script>
   (function () {
      function tick() {
         var clock = document.getElementById("clock");
         if (!clock) return;
         var now = new Date();
         clock.textContent =
            String(now.getHours()).padStart(2, "0") +
            ":" +
            String(now.getMinutes()).padStart(2, "0") +
            ":" +
            String(now.getSeconds()).padStart(2, "0");
      }
      tick();
      setInterval(tick, 1000);
   })();
</script>
