<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>Reset password — ShopEase</title>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
         href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap"
         rel="stylesheet"
      />
      <link rel="stylesheet" href="./static/css/theme.css" />
   </head>

   <body>
      <main class="centered">
         <div class="auth-card">
            <a class="auth-card__brand" href="./index.html">
               <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  width="26"
                  height="26"
                  aria-hidden="true"
                  style="color: var(--accent)"
               >
                  <path
                     d="M4 8h16l-1.3 11.2a1.5 1.5 0 0 1-1.5 1.3H6.8a1.5 1.5 0 0 1-1.5-1.3z"
                  />
                  <path d="M8.6 8V6.3a3.4 3.4 0 0 1 6.8 0V8" />
               </svg>
               <span class="brand__name">ShopEase</span>
            </a>

            <h1>Reset your password</h1>
            <p class="auth-card__sub">
               We will email you a link to choose a new password.
            </p>

            <form id="ForgotPasswordForm" class="auth-form">
               <div class="field">
                  <label for="email">Email</label>
                  <input
                     type="email"
                     id="email"
                     name="email"
                     placeholder="you@example.com"
                     autocomplete="email"
                     required
                  />
               </div>
               <button class="btn btn--block" type="submit">
                  Send reset link
               </button>
            </form>

            <p class="auth-card__foot">
               <a href="./login.html">Back to sign in</a>
            </p>
         </div>
      </main>

      <script src="./static/js/coman/toast.js"></script>
      <script>
         document
            .getElementById("ForgotPasswordForm")
            .addEventListener("submit", async (event) => {
               event.preventDefault();

               const submit = event.target.querySelector(
                  'button[type="submit"]'
               );
               const email = document.getElementById("email").value;

               submit.disabled = true;
               submit.classList.add("is-busy");

               try {
                  const response = await fetch(
                     "/api/auth/reset-password-link",
                     {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email }),
                        credentials: "include",
                     }
                  );

                  const data = await response.json();
                  submit.disabled = false;
                  submit.classList.remove("is-busy");

                  if (response.ok) {
                     toast("Check your inbox for the reset link");
                  } else {
                     toastError(data.msg || "Could not send the reset link");
                  }
               } catch (error) {
                  submit.disabled = false;
                  submit.classList.remove("is-busy");
                  toastError("Something went wrong. Please try again.");
               }
            });
      </script>
   </body>
</html>
