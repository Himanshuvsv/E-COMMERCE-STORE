<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Forgot Password - SHOPEASE</title>
      <link rel="stylesheet" href="./static/css/user/login.css" />
   </head>
   <body>
      <div class="container">
         <div class="header">
            <img src="./logo.jpeg" alt="Logo" />
            <h1 class="sitename">SHOPEASE</h1>
         </div>
         <form id="ForgotPasswordForm">
            <div class="form-group">
               <label for="email">Email</label>
               <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="Enter your email"
                  required
               />
            </div>
            <button type="submit" class="btn">Reset Password</button>
         </form>
         <li><a href="login.html" id="back-to-login">Back to Login</a></li>
         <div class="footer">
            <p>&copy; 2025 SHOPEASE. All rights reserved.</p>
         </div>
      </div>
      <script>
         document
            .getElementById("ForgotPasswordForm")
            .addEventListener("submit", async (event) => {
               event.preventDefault();

               const email = document.getElementById("email").value;

               try {
                  const response = await fetch(
                     "http://127.0.0.1:5000/api/auth/reset-password-link",
                     {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email }),
                        credentials: "include",
                     }
                  );

                  const data = await response.json();
                  console.log(data);

                  if (response.ok) {
                     alert("Please check your email for reset password link");
                  } else {
                     alert(data.msg || "Invalid request");
                  }
               } catch (error) {
                  console.error("Error during password reset:", error);
                  alert("Something went wrong. Please try again later.");
               }
            });
      </script>
   </body>
</html>
