<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>Wishlist — ShopEase</title>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
         href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap"
         rel="stylesheet"
      />
      <link rel="stylesheet" href="./static/css/theme.css" />
   </head>

   <body>
      <div id="navbar-container" data-src="navbar.html"></div>

      <main class="wrap page">
         <div class="head">
            <h1 class="head__title">Your wishlist</h1>
            <p class="head__sub">
               Pieces you saved for later. Move them to your cart whenever you
               are ready.
            </p>
         </div>

         <div class="bar">
            <span class="resultcount" id="resultCount"></span>
            <div class="bar__right">
               <a class="btn btn--ghost btn--sm" href="./index2.html"
                  >Continue shopping</a
               >
            </div>
         </div>

         <ul class="grid" id="wishlist-grid"></ul>
      </main>

      <div id="footer-placeholder"></div>

      <script src="./static/js/coman/nav.js"></script>
      <script src="./static/js/coman/toast.js"></script>
      <script src="./static/js/coman/currentUser.js"></script>
      <script src="./static/js/coman/shell.js"></script>
      <script src="./static/js/product/productCard.js"></script>
      <script src="./static/js/users/wishlisht.js"></script>
      <script src="./static/js/users/popup.js"></script>
   </body>
</html>
