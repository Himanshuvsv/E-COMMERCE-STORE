<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>Orders — ShopEase</title>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
         href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap"
         rel="stylesheet"
      />
      <link rel="stylesheet" href="./static/css/theme.css" />
      <link rel="stylesheet" href="./static/css/user/order.css" />
   </head>

   <body>
      <div id="navbar-container" data-src="navbar.html"></div>

      <main class="wrap page">
         <div class="head">
            <h1 class="head__title">Your orders</h1>
            <p class="head__sub">
               Track what you ordered, cancel an order or leave a review.
            </p>
         </div>

         <div class="bar">
            <span class="resultcount" id="total-orders">0 orders</span>
            <div class="bar__right">
               <div class="search" style="max-width: 280px">
                  <svg
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round"
                     aria-hidden="true"
                  >
                     <circle cx="11" cy="11" r="6.5" />
                     <path d="m16 16 4.5 4.5" />
                  </svg>
                  <input
                     id="orderSearch"
                     type="search"
                     placeholder="Search your orders"
                     aria-label="Search your orders"
                  />
               </div>
            </div>
         </div>

         <div class="stack" id="orders-container"></div>
      </main>

      <div id="footer-placeholder"></div>

      <script src="./static/js/coman/nav.js"></script>
      <script src="./static/js/coman/toast.js"></script>
      <script src="./static/js/coman/currentUser.js"></script>
      <script src="./static/js/coman/shell.js"></script>
      <script src="./static/js/users/viewOrders.js"></script>
   </body>
</html>
