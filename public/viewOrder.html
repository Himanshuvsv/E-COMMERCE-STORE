<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Your Orders</title>
      <link rel="stylesheet" href="./static/css/user/order.css" />
      <link rel="stylesheet" href="./static/css/user/main.css" />
      <link rel="stylesheet" href="./static/css/user/reviews.css" />

      <style>
         
      </style>
   </head>
   <body class="index-page">
      <div
         id="navbar-container"
         class="header d-flex align-items-center fixed-top"
      ></div>
      <div class="container">
         <h1>Your Orders</h1>
         <h2 id="total-orders">Total Orders: 0</h2>

         <div class="tabs">
            <button class="active">Orders</button>
         </div>
         <div class="search-orders">
            <input type="text" placeholder="Search all orders" />
            <button>Search Orders</button>
         </div>

         <div id="orders-container"></div>
      </div>

      <div id="footer-placeholder"></div>
      <script>
         fetch("footer.html")
            .then((response) => response.text())
            .then((data) => {
               document.getElementById("footer-placeholder").innerHTML = data;
            })
            .catch((error) => console.log("error loading footer", error));
      </script>
      <script src="./static/js/users/viewOrders.js"></script>
      <script src="./static/js/coman/currentUser.js"></script>
   </body>
</html>
