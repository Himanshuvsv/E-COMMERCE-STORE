<header class="top">
   <div class="wrap top__row">
      <button
         class="burger burger--drawer"
         type="button"
         data-panel="#drawer"
         aria-label="Open menu"
      >
         <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
            aria-hidden="true"
         >
            <path d="M4 7h16M4 12h16M4 17h16" />
         </svg>
      </button>

      <a class="brand" href="./index.html">
         <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
         >
            <path
               d="M4 8h16l-1.3 11.2a1.5 1.5 0 0 1-1.5 1.3H6.8a1.5 1.5 0 0 1-1.5-1.3z"
            />
            <path d="M8.6 8V6.3a3.4 3.4 0 0 1 6.8 0V8" />
         </svg>
         <span class="brand__name">ShopEase</span>
      </a>

      <nav class="nav" aria-label="Main">
         <a href="./index.html">Home</a>
         <a href="./guestabout.html">About</a>
         <a href="./guestcontact.html">Contact</a>
      </nav>

      <div class="search">
         <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
         >
            <circle cx="11" cy="11" r="6.5" />
            <path d="m16 16 4.5 4.5" />
         </svg>
         <input
            id="searchInput"
            type="search"
            placeholder="Search products"
            aria-label="Search products"
         />
      </div>

      <a class="who" href="./login.html">Sign in</a>
      <a class="btn btn--sm" href="./register.html">Register</a>
   </div>
</header>

<aside class="drawer" id="drawer" aria-label="Menu">
   <div class="drawer__head">
      <span class="brand__name">ShopEase</span>
      <button
         class="drawer__close"
         type="button"
         data-panel-close
         aria-label="Close menu"
      >
         &times;
      </button>
   </div>
   <ul>
      <li><a href="./index.html">Home</a></li>
      <li><a href="./guestabout.html">About</a></li>
      <li><a href="./guestcontact.html">Contact</a></li>
   </ul>
   <p class="drawer__label">Account</p>
   <ul>
      <li><a href="./login.html">Sign in</a></li>
      <li><a href="./register.html">Create account</a></li>
   </ul>
</aside>
