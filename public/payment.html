<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>Checkout — ShopEase</title>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
         href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap"
         rel="stylesheet"
      />
      <link rel="stylesheet" href="./static/css/theme.css" />
      <link rel="stylesheet" href="./static/css/user/payment.css" />
      <script src="https://js.stripe.com/v3/"></script>
   </head>

   <body>
      <header class="top">
         <div class="wrap top__row">
            <a class="brand" href="./index2.html">
               <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
               >
                  <path
                     d="M4 8h16l-1.3 11.2a1.5 1.5 0 0 1-1.5 1.3H6.8a1.5 1.5 0 0 1-1.5-1.3z"
                  />
                  <path d="M8.6 8V6.3a3.4 3.4 0 0 1 6.8 0V8" />
               </svg>
               <span class="brand__name">ShopEase</span>
            </a>
            <span class="badge badge--ok nowrap" style="margin-left: auto"
               >Secure checkout</span
            >
         </div>
      </header>

      <main class="wrap page">
         <div class="head">
            <h1 class="head__title">Checkout</h1>
            <p class="head__sub">
               Your card details are handled directly by Stripe.
            </p>
         </div>

         <div class="checkout-layout">
            <section class="card" style="order: 2">
               <div class="card__head">
                  <div>
                     <h2 class="card__title">Payment</h2>
                     <p class="card__sub">Card or debit card</p>
                  </div>
               </div>

               <div class="field">
                  <label for="card-element">Card details</label>
                  <div id="card-element" class="card-element"></div>
                  <span class="field__hint" id="error-message"></span>
               </div>

               <button class="btn btn--block" id="submit-button" type="button" style="margin-top: 18px">
                  Pay now
               </button>

               <p class="muted" style="font-size: 12.5px; margin: 14px 0 0">
                  You can cancel an order and request a refund from the orders
                  page.
               </p>
            </section>

            <aside class="stack" style="order: 1">
               <div class="card">
                  <div class="card__head">
                     <div>
                        <h2 class="card__title">Order summary</h2>
                        <p class="card__sub">Items in this order</p>
                     </div>
                  </div>
                  <div class="product-details" id="product-details"></div>
                  <div class="rows" style="margin-top: 16px">
                     <div class="row">
                        <span class="row__key">Subtotal</span>
                        <span class="row__val" id="subtotal">₹0</span>
                     </div>
                     <div class="row">
                        <span class="row__key">Shipping</span>
                        <span class="row__val" id="shipping">₹50</span>
                     </div>
                     <div class="row">
                        <span class="row__key">Total</span>
                        <span class="row__val price" id="total">₹0</span>
                     </div>
                  </div>
               </div>

               <a class="btn btn--ghost" href="./cart.html">Back to cart</a>
            </aside>
         </div>
      </main>

      <script src="./static/js/coman/toast.js"></script>
      <script>
         const stripe = Stripe(
            "pk_test_51QuTIE2UJMTuoy4fzrsCrPeMWS956B3bQD4XR6UJKAOIz3toz6fxCJzlwjyXJYkkIvE86KzwBNyXhYN8ICFdBioC00ipeLKcRt"
         );
         const elements = stripe.elements({
            fonts: [
               {
                  cssSrc:
                     "https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&display=swap",
               },
            ],
         });
         const card = elements.create("card", {
            style: {
               base: {
                  fontFamily: "Archivo, Helvetica Neue, Arial, sans-serif",
                  fontSize: "16px",
                  color: "#151A16",
                  "::placeholder": { color: "#9AA39B" },
               },
               invalid: { color: "#B3261E" },
            },
         });
         card.mount("#card-element");

         const submitButton = document.getElementById("submit-button");
         const errorMessage = document.getElementById("error-message");

         let cartItems = [];

         async function fetchCartItems() {
            try {
               const response = await fetch("/api/cart", {
                  method: "GET",
                  credentials: "include",
               });

               if (!response.ok) throw new Error("Failed to fetch cart items");

               cartItems = await response.json();
               const container = document.getElementById("product-details");
               let subtotal = 0;

               container.innerHTML = cartItems
                  .map((item) => {
                     subtotal += item.price * item.quantity;
                     return `
                  <div class="summary-item">
                     <img src="${item.image}" alt="${item.name}">
                     <div>
                        <p class="summary-item__name">${item.name}</p>
                        <p class="summary-item__meta">${item.category} · Qty ${item.quantity}</p>
                     </div>
                     <span class="summary-item__price">₹${
                        item.price * item.quantity
                     }</span>
                  </div>`;
                  })
                  .join("");

               const shippingFee = 50;
               document.getElementById("subtotal").textContent = `₹${subtotal}`;
               document.getElementById(
                  "shipping"
               ).textContent = `₹${shippingFee}`;
               document.getElementById("total").textContent = `₹${
                  subtotal + shippingFee
               }`;
            } catch (error) {
               toastError("Could not load your cart");
            }
         }

         fetchCartItems();

         submitButton.addEventListener("click", async () => {
            submitButton.disabled = true;
            submitButton.classList.add("is-busy");
            errorMessage.textContent = "";

            const { paymentMethod, error } = await stripe.createPaymentMethod({
               type: "card",
               card: card,
            });

            function fail(message) {
               errorMessage.textContent = message;
               errorMessage.style.color = "var(--danger)";
               submitButton.disabled = false;
               submitButton.classList.remove("is-busy");
            }

            if (error) return fail(error.message);
            if (!paymentMethod || !paymentMethod.id) {
               return fail("Could not read those card details.");
            }

            try {
               const totalAmount =
                  parseInt(
                     document
                        .getElementById("total")
                        .textContent.replace("₹", "")
                        .trim(),
                     10
                  ) * 100;

               const paymentResponse = await fetch(
                  "/api/payment/create-payment-intent",
                  {
                     method: "POST",
                     credentials: "include",
                     headers: { "Content-Type": "application/json" },
                     body: JSON.stringify({
                        amount: totalAmount,
                        currency: "INR",
                        paymentMethodId: paymentMethod.id,
                     }),
                  }
               );

               const paymentData = await paymentResponse.json();

               if (!paymentResponse.ok || paymentData.status !== "succeeded") {
                  throw new Error(paymentData.message || "Payment failed");
               }

               const orderResponse = await fetch("/api/orders", {
                  method: "POST",
                  credentials: "include",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ cartItems }),
               });

               if (!orderResponse.ok) throw new Error("Order placement failed");

               const orderData = await orderResponse.json();

               const updateResponse = await fetch(
                  `/api/orders/${orderData.order._id}`,
                  {
                     method: "PATCH",
                     credentials: "include",
                     headers: { "Content-Type": "application/json" },
                     body: JSON.stringify({
                        paymentStatus: "paid",
                        paymentIntentId: paymentData.paymentIntentId,
                     }),
                  }
               );

               if (!updateResponse.ok) {
                  throw new Error("Failed to update payment status");
               }

               await fetch("/api/cart", {
                  method: "DELETE",
                  credentials: "include",
               });

               window.location.href = "success.html";
            } catch (error) {
               fail(error.message || "Payment request failed.");
            }
         });
      </script>
   </body>
</html>
