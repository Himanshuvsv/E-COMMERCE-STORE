      />

               src="./logo.jpeg"

               alt="Profile Image"
            />
            SHOPEASE DASHBOARD

         <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
               <li class="nav-item active">
                  <a class="nav-link" href="./dashboard.html">Home</a>
               </li>
               
               <li class="nav-item dropdown">
                  <a
                     class="nav-link dropdown-toggle"
                     href="#"
                     id="userDropdown"
                     role="button"
                     data-toggle="dropdown"
                     aria-haspopup="true"
                     aria-expanded="false"
                  >
                     <img
                        src="./profile.png"
                        width="30"

      <!-- Sidebar and Main Content -->
      <div class="d-flex">
         <div class="sidebar p-3">
            <div class="header text-center">
               <h1 style="color: red">SHOPESEA</h1>
            </div>
            <ul class="list-unstyled">
               <li><a href="./dashboard.html">Dashboard</a></li>
               <li><a href="./viewCustommerce.html">Customers</a></li>
               <li><a href="./add-products.html">Add Products</a></li>
               <li><a href="./adminProductList.html">Manage Products</a></li>
               <li><a href="./orders.html">Orders</a></li>

            </ul>
         </div>

    
         <div class="container">
            <h2>Add Product</h2>
         
            <form id="addProductForm">
               <label for="name">Product Name:</label>
               <input type="text" id="name" name="name" required />
         
               <label for="price">Price:</label>
               <input type="number" id="price" name="price" required />
         
               <label for="description">Description:</label>
               <textarea
                  id="description"
                  name="description"
                  required
               ></textarea>
         
               <label for="image">Image:</label>
               <input type="file" id="image" name="image" />
         
               <label for="category">Category:</label>
               <select id="category" name="category" required>
                  <option value="office">Office</option>
                  <option value="kitchen">Kitchen</option>
                  <option value="bedroom">Bedroom</option>
               </select>
         
               <label for="company">Company:</label>
               <select id="company" name="company" required>
                  <option value="ikea">IKEA</option>
                  <option value="liddy">Liddy</option>
                  <option value="marcos">Marcos</option>
               </select>
         
               <label for="colors">Colors :</label>
               <input type="text" id="colors" name="colors" />
         
               <label>
                  Featured Product
                  <input type="checkbox" id="featured" name="featured" />
               </label>
         
               <label>
                  Free Shipping
                  <input
                     type="checkbox"
                     id="freeShipping"
                     name="freeShipping"
                  />
               </label>
         
               <label for="inventory">Inventory:</label>
               <input type="number" id="inventory" name="inventory" />
         
               <button type="submit">Add Product</button>
            </form>
         </div>



      </div>
      <script src="./static/js/product/createProduct.js"></script>
      <script src="./static/js/coman/currentUser.js"></script>
      <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
   </body>
