<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>Add product — ShopEase Admin</title>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
         href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap"
         rel="stylesheet"
      />
      <link rel="stylesheet" href="./static/css/theme.css" />
   </head>

   <body>
      <div id="admin-header"></div>

      <div class="admin">
         <div id="admin-sidebar"></div>

         <main class="admin-main">
            <div class="head" style="padding-top: 0">
               <h1 class="head__title">Add a product</h1>
               <p class="head__sub">
                  New products appear in the storefront as soon as they are
                  saved.
               </p>
            </div>

            <form id="addProductForm" style="margin-top: 26px; max-width: 760px">
               <div class="card">
                  <div class="card__head">
                     <div>
                        <h2 class="card__title">Details</h2>
                        <p class="card__sub">Name, price and description</p>
                     </div>
                  </div>

                  <div class="form-grid">
                     <div class="field form-grid--full">
                        <label for="name">Product name</label>
                        <input type="text" id="name" name="name" required />
                     </div>

                     <div class="field">
                        <label for="price">Price</label>
                        <input
                           type="number"
                           id="price"
                           name="price"
                           step="0.01"
                           min="0"
                           required
                        />
                     </div>

                     <div class="field">
                        <label for="inventory">Inventory</label>
                        <input type="number" id="inventory" name="inventory" min="0" />
                     </div>

                     <div class="field form-grid--full">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" required></textarea>
                     </div>
                  </div>
               </div>

               <div class="card" style="margin-top: 16px">
                  <div class="card__head">
                     <div>
                        <h2 class="card__title">Classification</h2>
                        <p class="card__sub">Category, brand and colours</p>
                     </div>
                  </div>

                  <div class="form-grid">
                     <div class="field">
                        <label for="category">Category</label>
                        <select id="category" name="category" required>
                           <option value="office">Office</option>
                           <option value="kitchen">Kitchen</option>
                           <option value="bedroom">Bedroom</option>
                        </select>
                     </div>

                     <div class="field">
                        <label for="company">Company</label>
                        <select id="company" name="company" required>
                           <option value="ikea">IKEA</option>
                           <option value="liddy">Liddy</option>
                           <option value="marcos">Marcos</option>
                        </select>
                     </div>

                     <div class="field form-grid--full">
                        <label for="colors">Colours</label>
                        <input type="text" id="colors" name="colors" placeholder="#222, #555" />
                        <span class="field__hint">Comma separated hex values.</span>
                     </div>

                     <div class="field form-grid--full">
                        <label for="image">Image</label>
                        <input type="file" id="image" name="image" accept="image/*" />
                     </div>

                     <div class="form-grid--full actions">
                        <label
                           style="
                              display: inline-flex;
                              align-items: center;
                              gap: 8px;
                              font-weight: 500;
                           "
                        >
                           <input type="checkbox" id="featured" name="featured" />
                           Featured product
                        </label>
                        <label
                           style="
                              display: inline-flex;
                              align-items: center;
                              gap: 8px;
                              font-weight: 500;
                           "
                        >
                           <input
                              type="checkbox"
                              id="freeShipping"
                              name="freeShipping"
                           />
                           Free shipping
                        </label>
                     </div>
                  </div>
               </div>

               <div class="actions" style="margin-top: 20px">
                  <button class="btn" type="submit">Add product</button>
                  <a class="btn btn--ghost" href="./adminProductList.html"
                     >Back to products</a
                  >
               </div>
            </form>
         </main>
      </div>

      <script src="./static/js/coman/nav.js"></script>
      <script src="./static/js/coman/toast.js"></script>
      <script src="./static/js/coman/currentUser.js"></script>
      <script src="./static/js/coman/adminShell.js"></script>
      <script src="./static/js/product/createProduct.js"></script>
   </body>
</html>
