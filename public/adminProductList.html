<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>Products — ShopEase Admin</title>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
         href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap"
         rel="stylesheet"
      />
      <link rel="stylesheet" href="./static/css/theme.css" />
   </head>

   <body>
      <div id="admin-header"></div>

      <div class="admin">
         <div id="admin-sidebar"></div>

         <main class="admin-main">
            <div class="head" style="padding-top: 0">
               <h1 class="head__title">Products</h1>
               <p class="head__sub">
                  Edit pricing, stock and imagery for everything in the catalog.
               </p>
            </div>

            <div class="stat-grid" style="margin-top: 22px">
               <div class="stat">
                  <p class="stat__label">Products</p>
                  <p class="stat__value" id="totalProducts">—</p>
               </div>
               <div class="stat">
                  <p class="stat__label">Total stock</p>
                  <p class="stat__value" id="availableStock">—</p>
               </div>
            </div>

            <div class="bar" style="margin-top: 24px">
               <div class="chips" id="categoryChips" role="group" aria-label="Filter by category">
                  <button class="chip" type="button" data-cat="" aria-pressed="true">
                     All
                  </button>
                  <button class="chip" type="button" data-cat="office" aria-pressed="false">
                     Office
                  </button>
                  <button class="chip" type="button" data-cat="kitchen" aria-pressed="false">
                     Kitchen
                  </button>
                  <button class="chip" type="button" data-cat="bedroom" aria-pressed="false">
                     Bedroom
                  </button>
               </div>
               <div class="bar__right">
                  <div class="search" style="max-width: 280px">
                     <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        aria-hidden="true"
                     >
                        <circle cx="11" cy="11" r="6.5" />
                        <path d="m16 16 4.5 4.5" />
                     </svg>
                     <input
                        id="searchInput"
                        type="search"
                        placeholder="Search products"
                        aria-label="Search products"
                     />
                  </div>
                  <a class="btn btn--sm" href="./add-products.html">Add product</a>
               </div>
            </div>

            <div class="table-wrap">
               <table class="table">
                  <thead>
                     <tr>
                        <th>Product</th>
                        <th>Category</th>
                        <th>Company</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Actions</th>
                     </tr>
                  </thead>
                  <tbody id="productTable">
                     <tr>
                        <td class="table__empty" colspan="6">Loading products…</td>
                     </tr>
                  </tbody>
               </table>
            </div>
         </main>
      </div>

      <script src="./static/js/coman/nav.js"></script>
      <script src="./static/js/coman/toast.js"></script>
      <script src="./static/js/coman/currentUser.js"></script>
      <script src="./static/js/coman/adminShell.js"></script>
      <script src="./static/js/product/productList.js"></script>
      <script src="./static/js/product/deleteProduct.js"></script>
   </body>
</html>
