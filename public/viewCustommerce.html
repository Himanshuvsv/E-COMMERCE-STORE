<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>Customers — ShopEase Admin</title>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
         href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap"
         rel="stylesheet"
      />
      <link rel="stylesheet" href="./static/css/theme.css" />
   </head>

   <body>
      <div id="admin-header"></div>

      <div class="admin">
         <div id="admin-sidebar"></div>

         <main class="admin-main">
            <div class="head" style="padding-top: 0">
               <h1 class="head__title">Customers</h1>
               <p class="head__sub">
                  Everyone who has created an account on the store.
               </p>
            </div>

            <div class="bar" style="margin-top: 24px">
               <span class="resultcount" id="customerCount"></span>
               <div class="bar__right">
                  <div class="search" style="max-width: 300px">
                     <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        aria-hidden="true"
                     >
                        <circle cx="11" cy="11" r="6.5" />
                        <path d="m16 16 4.5 4.5" />
                     </svg>
                     <input
                        id="searchInput"
                        type="search"
                        placeholder="Search customers"
                        aria-label="Search customers"
                     />
                  </div>
               </div>
            </div>

            <div class="table-wrap">
               <table class="table">
                  <thead>
                     <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Joined</th>
                        <th>Customer ID</th>
                     </tr>
                  </thead>
                  <tbody id="customerTable">
                     <tr>
                        <td class="table__empty" colspan="4">Loading customers…</td>
                     </tr>
                  </tbody>
               </table>
            </div>
         </main>
      </div>

      <script src="./static/js/coman/nav.js"></script>
      <script src="./static/js/coman/toast.js"></script>
      <script src="./static/js/coman/currentUser.js"></script>
      <script src="./static/js/coman/adminShell.js"></script>
      <script src="./static/js/users/getAlluser.js"></script>
   </body>
</html>
