<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>Payment history — ShopEase</title>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
         href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap"
         rel="stylesheet"
      />
      <link rel="stylesheet" href="./static/css/theme.css" />
   </head>

   <body>
      <div id="navbar-container" data-src="navbar.html"></div>

      <main class="wrap page">
         <div class="head">
            <h1 class="head__title">Payment history</h1>
            <p class="head__sub">
               Every transaction on your account, including refunds.
            </p>
         </div>

         <div class="bar">
            <div class="chips" id="paymentChips" role="group" aria-label="Filter by status">
               <button class="chip" type="button" data-status="" aria-pressed="true">
                  All <span id="allCount">0</span>
               </button>
               <button class="chip" type="button" data-status="succeeded" aria-pressed="false">
                  Succeeded <span id="succeededCount">0</span>
               </button>
               <button class="chip" type="button" data-status="refunded" aria-pressed="false">
                  Refunded <span id="refundedCount">0</span>
               </button>
               <button class="chip" type="button" data-status="disputed" aria-pressed="false">
                  Disputed <span id="disputedCount">0</span>
               </button>
               <button class="chip" type="button" data-status="failed" aria-pressed="false">
                  Failed <span id="failedCount">0</span>
               </button>
            </div>
         </div>

         <div class="table-wrap">
            <table class="table">
               <thead>
                  <tr>
                     <th>Amount</th>
                     <th>Status</th>
                     <th>Method</th>
                     <th>Description</th>
                     <th>Date</th>
                     <th>Refunded</th>
                  </tr>
               </thead>
               <tbody id="paymentTableBody">
                  <tr>
                     <td class="table__empty" colspan="6">Loading transactions…</td>
                  </tr>
               </tbody>
            </table>
         </div>
      </main>

      <div id="footer-placeholder"></div>

      <script src="./static/js/coman/api.js"></script>
      <script src="./static/js/coman/nav.js"></script>
      <script src="./static/js/coman/toast.js"></script>
      <script src="./static/js/coman/currentUser.js"></script>
      <script src="./static/js/coman/shell.js"></script>
      <script>
         const statusTone = {
            succeeded: "badge--ok",
            refunded: "badge--warn",
            disputed: "badge--warn",
            failed: "badge--danger",
         };

         let allPayments = [];
         let paymentFilter = "";

         function renderPayments() {
            const body = document.getElementById("paymentTableBody");
            const rows = paymentFilter
               ? allPayments.filter((item) => item.status === paymentFilter)
               : allPayments;

            if (!rows.length) {
               body.innerHTML =
                  '<tr><td class="table__empty" colspan="6">No transactions to show.</td></tr>';
               return;
            }

            body.innerHTML = rows
               .map((payment) => {
                  const amount = payment.amount
                     ? "₹" + (payment.amount / 100).toFixed(2)
                     : "—";
                  const status = payment.status || "unknown";

                  return `
               <tr>
                  <td data-label="Amount"><strong style="color:var(--ink)">${amount}</strong></td>
                  <td data-label="Status">
                     <span class="badge ${statusTone[status] || ""}">${
                     status.charAt(0).toUpperCase() + status.slice(1)
                  }</span>
                  </td>
                  <td data-label="Method">${payment.paymentMethod || "Card"}</td>
                  <td data-label="Description">${payment.description || "—"}</td>
                  <td data-label="Date">${
                     payment.date ? new Date(payment.date).toLocaleString() : "—"
                  }</td>
                  <td data-label="Refunded">${
                     payment.refundedDate
                        ? new Date(payment.refundedDate).toLocaleString()
                        : "—"
                  }</td>
               </tr>`;
               })
               .join("");
         }

         async function fetchPaymentHistory() {
            try {
               const response = await apiFetch("/api/payment/paymentHistory");
               const data = await response.json();
               allPayments = data.payments || [];

               const counts = {
                  succeeded: 0,
                  refunded: 0,
                  disputed: 0,
                  failed: 0,
               };
               allPayments.forEach((payment) => {
                  if (counts[payment.status] !== undefined) {
                     counts[payment.status]++;
                  }
               });

               document.getElementById("allCount").textContent =
                  allPayments.length;
               document.getElementById("succeededCount").textContent =
                  counts.succeeded;
               document.getElementById("refundedCount").textContent =
                  counts.refunded;
               document.getElementById("disputedCount").textContent =
                  counts.disputed;
               document.getElementById("failedCount").textContent =
                  counts.failed;

               renderPayments();
            } catch (error) {
               document.getElementById("paymentTableBody").innerHTML =
                  '<tr><td class="table__empty" colspan="6">Could not load transactions.</td></tr>';
            }
         }

         document.addEventListener("DOMContentLoaded", () => {
            document
               .getElementById("paymentChips")
               .addEventListener("click", (event) => {
                  const chip = event.target.closest(".chip");
                  if (!chip) return;

                  paymentFilter = chip.dataset.status || "";
                  document
                     .querySelectorAll("#paymentChips .chip")
                     .forEach((item) => {
                        item.setAttribute(
                           "aria-pressed",
                           item === chip ? "true" : "false"
                        );
                     });
                  renderPayments();
               });

            fetchPaymentHistory();
         });
      </script>
   </body>
</html>
