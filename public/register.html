<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>Create account — ShopEase</title>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
         href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap"
         rel="stylesheet"
      />
      <link rel="stylesheet" href="./static/css/theme.css" />
   </head>

   <body>
      <main class="centered">
         <div class="auth-card">
            <a class="auth-card__brand" href="./index.html">
               <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  width="26"
                  height="26"
                  aria-hidden="true"
                  style="color: var(--accent)"
               >
                  <path
                     d="M4 8h16l-1.3 11.2a1.5 1.5 0 0 1-1.5 1.3H6.8a1.5 1.5 0 0 1-1.5-1.3z"
                  />
                  <path d="M8.6 8V6.3a3.4 3.4 0 0 1 6.8 0V8" />
               </svg>
               <span class="brand__name">ShopEase</span>
            </a>

            <h1>Create your account</h1>
            <p class="auth-card__sub">
               Save a wishlist, track orders and check out faster.
            </p>

            <form id="signupForm" class="auth-form">
               <div class="field">
                  <label for="name">Name</label>
                  <input
                     type="text"
                     id="name"
                     name="name"
                     placeholder="Your full name"
                     autocomplete="name"
                     required
                  />
               </div>
               <div class="field">
                  <label for="email">Email</label>
                  <input
                     type="email"
                     id="email"
                     name="email"
                     placeholder="you@example.com"
                     autocomplete="email"
                     required
                  />
               </div>
               <div class="field">
                  <label for="password">Password</label>
                  <input
                     type="password"
                     id="password"
                     name="password"
                     placeholder="At least 6 characters"
                     autocomplete="new-password"
                     minlength="6"
                     required
                  />
               </div>
               <div class="field">
                  <label for="confirmpassword">Confirm password</label>
                  <input
                     type="password"
                     id="confirmpassword"
                     name="confirmpassword"
                     placeholder="Repeat your password"
                     autocomplete="new-password"
                     required
                  />
               </div>
               <button class="btn btn--block" type="submit">
                  Create account
               </button>
            </form>

            <p class="auth-card__foot">
               Already have an account? <a href="./login.html">Sign in</a>
            </p>
         </div>
      </main>

      <script src="./static/js/coman/api.js"></script>
      <script src="./static/js/coman/toast.js"></script>
      <script>
         document
            .getElementById("signupForm")
            .addEventListener("submit", async (event) => {
               event.preventDefault();

               const submit = event.target.querySelector(
                  'button[type="submit"]'
               );
               const name = document.getElementById("name").value;
               const email = document.getElementById("email").value;
               const password = document.getElementById("password").value;
               const confirmPassword =
                  document.getElementById("confirmpassword").value;

               if (password !== confirmPassword) {
                  toastError("Those passwords do not match");
                  return;
               }

               submit.disabled = true;
               submit.classList.add("is-busy");

               try {
                  const response = await fetch("/api/auth/register", {
                     method: "POST",
                     headers: { "Content-Type": "application/json" },
                     body: JSON.stringify({ name, email, password }),
                  });

                  const data = await response.json().catch(() => ({}));

                  if (response.ok) {
                     if (data.token) setToken(data.token);
                     toast("Account created");
                     window.location.href =
                        data.user && data.user.role === "admin"
                           ? "dashboard.html"
                           : "index2.html";
                     return;
                  }

                  submit.disabled = false;
                  submit.classList.remove("is-busy");
                  toastError(data.msg || data.error || "Could not register");
               } catch (error) {
                  submit.disabled = false;
                  submit.classList.remove("is-busy");
                  toastError("Something went wrong. Please try again.");
               }
            });
      </script>
   </body>
</html>
