<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Signup - SHOPEASE</title>
      <link rel="stylesheet" href="./static/css/user/register.css" />
   </head>
   <body>
      <div class="container">
         <div class="header">
            <img src="./logo.jpeg" alt="Logo" />
            <h1 class="sitename">SHOPEASE</h1>
         </div>
         <form id="signupForm">
            <div class="form-group">
               <label for="name">Name</label>
               <input
                  type="text"
                  id="name"
                  name="name"
                  placeholder="Enter your name"
                  required
               />
            </div>
            <div class="form-group">
               <label for="email">Email</label>
               <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="Enter your email"
                  required
               />
            </div>
            <div class="form-group">
               <label for="password">Password</label>
               <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Enter your password"
                  required
               />
            </div>
            <div class="form-group">
               <label for="confirmpassword">Confirm Password</label>
               <input
                  type="password"
                  id="confirmpassword"
                  name="confirmpassword"
                  placeholder="Confirm your password"
                  required
               />
            </div>
            <button type="submit" class="btn">Signup</button>
            <li>
               <a href="./login.html" id="login-link"
                  >all ready have an acount ...Login here</a
               >
            </li>
         </form>
         <div class="footer">
            <p>&copy; 2025 SHOPEASE. All rights reserved.</p>
         </div>
      </div>
      <script>
         document.addEventListener("DOMContentLoaded", () => {
            const signupForm = document.getElementById("signupForm");

            signupForm.addEventListener("submit", async (event) => {
               event.preventDefault();

               const name = document.getElementById("name").value;
               const email = document.getElementById("email").value;
               const password = document.getElementById("password").value;
               const confirmPassword =
                  document.getElementById("confirmpassword").value;
               if (password !== confirmPassword) {
                  alert("Passwords do not match. Please try again.");
                  return;
               }

               try {
                  const response = await fetch(
                     "http://127.0.0.1:5000/api/auth/register",
                     {
                        method: "POST",
                        headers: {
                           "Content-Type": "application/json",
                        },
                        body: JSON.stringify({ name, email, password }),
                     }
                  );
                  if (response.ok) {
                     const data = await response.json();
                     alert(
                        "Registration successful! Welcome, " + data.user.name
                     );
                     window.location.href = "login.html";
                  } else {
                     const errorText = await response.text();
                     try {
                        const errorData = JSON.parse(errorText);
                        alert(`Error: ${errorData["msg"]}`);
                     } catch (e) {
                        alert(
                           `Error: ${
                              errorText || "An unexpected error occurred"
                           }`
                        );
                     }
                  }
               } catch (error) {
                  alert(
                     "An unexpected error occurred. Please try again later."
                  );
               }
            });
         });
      </script>
   </body>
</html>
