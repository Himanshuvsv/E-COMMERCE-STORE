<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Cart Page</title>
      <link href="https://fonts.googleapis.com" rel="preconnect" />
      <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin />
      <link
         href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Nunito:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
         rel="stylesheet"
      />
      <link rel="stylesheet" href="./static/css/user/cart.css" />
      <link rel="stylesheet" href="./static/css/user/main.css" />
      <link rel="stylesheet" href="./static/css/user/footer.css" />
   </head>
   <body>
      <div
         id="navbar-container"
         class="header d-flex align-items-center fixed-top"
      ></div>
      <div class="cart-container">
         <div class="product-details">
            <h2>Product Details</h2>
            <div class="product-card">
               <img src="" alt="" />
               <div class="product-info">
                  <span class="mall-tag">Mall</span>
                  <h3></h3>
                  <p class="price">
                     <span class="original-price"></span>
                     <span class="discount"></span>
                  </p>
                  <p>All issue easy returns</p>
                  <p>Qty:</p>
                  <a href="#" class="remove">✖ REMOVE</a>
               </div>
            </div>
            <p class="sold-by">
               Sold by: Asian <span class="free-delivery">Free Delivery</span>
            </p>
         </div>
         <div class="price-details">
            <h2>Price Details (1 Items)</h2>
            <p>Total Product Price <span class="price"></span></p>
            <p>Total Discounts <span class="discount"></span></p>
            <hr />
            <p class="order-total">Order Total <span class="total"></span></p>
            <div class="discount-info">✅ Yay! Your total discount is ₹0</div>
            <button class="continue-btn">Continue</button>
            <div class="safety-info">
               <p>🛡 Your Safety, Our Priority</p>
               <p>
                  We make sure that your package is safe at every point of
                  contact.
               </p>
            </div>
         </div>
      </div>
      <div id="footer-placeholder"></div>
      <script>
         async function loadNavbar() {
            try {
               const response = await fetch("navbar.html");
               const navbarHTML = await response.text();
               document.getElementById("navbar-container").innerHTML =
                  navbarHTML;
               fetchUser();
            } catch (error) {}
         }
         loadNavbar();
      </script>
      <script>
         fetch("footer.html")
            .then((response) => response.text())
            .then((data) => {
               document.getElementById("footer-placeholder").innerHTML = data;
            })
            .catch((error) => {});
      </script>
      <script src="./static/js/cart/getCartItems.js"></script>
      <script src="./static/js/cart/orderPlace.js"></script>
      <script src="./static/js/coman/currentUser.js"></script>
   </body>
</html>
