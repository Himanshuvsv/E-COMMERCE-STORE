<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>Cart — ShopEase</title>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
         href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap"
         rel="stylesheet"
      />
      <link rel="stylesheet" href="./static/css/theme.css" />
      <link rel="stylesheet" href="./static/css/user/cart.css" />
   </head>

   <body>
      <div id="navbar-container" data-src="navbar.html"></div>

      <main class="wrap page">
         <div class="head">
            <h1 class="head__title">Your cart</h1>
            <p class="head__sub">
               Review your items before checking out. Free delivery over $250.
            </p>
         </div>

         <div class="cart-layout">
            <section class="stack--sm" id="cart-items" style="display: grid; gap: 12px">
               <div class="card muted">Loading your cart…</div>
            </section>

            <aside class="card cart-summary" id="cart-summary"></aside>
         </div>
      </main>

      <div id="footer-placeholder"></div>

      <script src="./static/js/coman/nav.js"></script>
      <script src="./static/js/coman/toast.js"></script>
      <script src="./static/js/coman/currentUser.js"></script>
      <script src="./static/js/coman/shell.js"></script>
      <script src="./static/js/cart/getCartItems.js"></script>
      <script src="./static/js/cart/orderPlace.js"></script>
   </body>
</html>
