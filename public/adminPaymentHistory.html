      <link

      />
      <link rel="stylesheet" href="./static/css/admin/dashboard.css" />
      <link rel="stylesheet" href="./static/css/admin/payments.css">
   </head>

            <img
               src="./logo.jpeg"
               width="30"
               height="30"
               class="d-inline-block align-top"
               alt="Profile Image"
            />
            SHOPEASE DASHBOARD
         </a>
         <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
               <li class="nav-item active">
                  <a class="nav-link" href="./dashboard.html">Home</a>
               </li>
               
               <li class="nav-item dropdown">
                  <a
                     class="nav-link dropdown-toggle"
                     href="#"
                     id="userDropdown"
                     role="button"
                     data-toggle="dropdown"

                     <img
                        src="./profile.png"
                        width="30"

                     />

                  </a>
                  <div
                     class="dropdown-menu dropdown-menu-right"
                     aria-labelledby="userDropdown"
                  >
                     <a class="dropdown-item" href="./adminProfile.html">Profile</a>
                     <a class="dropdown-item text-danger" href="./logout.html"
                        >Log Out</a
                     >
                  </div>
               </li>
            </ul>
         </div>
      </nav>
      <!-- Sidebar and Main Content -->
      <div class="d-flex">
         <div class="sidebar p-3">
            <div class="header text-center">
               <h1 style="color: red">SHOPESEA</h1>
            </div>
            <ul class="list-unstyled">
               <li><a href="./dashboard.html">Dashboard</a></li>
               <li><a href="./viewCustommerce.html">Customers</a></li>
               <li><a href="./add-products.html">Add Products</a></li>
               <li><a href="./adminProductList.html">Manage Products</a></li>
               <li><a href="./orders.html">Orders</a></li>
               <li><a href="./adminReviews.html">Reviews</a></li>
               <li><a href="">Payments</a></li>
               <li><a class="text-danger" href="./logout.html">Log Out</a></li>
            </ul>
         </div>

         <div class="container">
            <h1>Transactions</h1>
            <div class="filters">
               <button id="allBtn" class="active">All <strong> 0</strong></button>
               <button id="succeededBtn">Succeeded  <strong> 0</strong></button>
               <button id="refundedBtn">Refunded  <strong> 0</strong></button>
               <button id="disputedBtn">Disputed <strong> 0</strong></button>
               <button id="failedBtn">Failed <strong> 0</strong></button>
            </div>
            <table>
               <thead>
                  <tr>
                     <th>Amount</th>
                     <th>Currency</th>
                     <th>Status</th>
                     <th>Payment Method</th>
                     <th>Description</th>
                     <th>Customer</th>
                     <th>Date</th>
                     <th>Refunded Date</th>
                  </tr>
               </thead>
               <tbody id="paymentTableBody">
                  <tr>
                     <td colspan="8" style="text-align: center">Loading...</td>
                  </tr>
               </tbody>
            </table>
         </div>
         <script>
            async function fetchPaymentHistory() {
               try {
                  const response = await fetch(
                     "http://127.0.0.1:5000/api/payment"
                  );
                  const data = await response.json();
                  const tableBody = document.getElementById("paymentTableBody");
                  const allBtn = document.getElementById("allBtn");
                  const succeededBtn = document.getElementById("succeededBtn");
                  const refundedBtn = document.getElementById("refundedBtn");
                  const disputedBtn = document.getElementById("disputedBtn");
                  const failedBtn = document.getElementById("failedBtn");
   
                  tableBody.innerHTML = "";
   
                  let succeededCount = 0,
                     refundedCount = 0,
                     disputedCount = 0,
                     failedCount = 0;
   
                  data.payments.forEach((payment) => {
                     if (payment.status === "succeeded") succeededCount++;
                     if (payment.status === "refunded") refundedCount++;
                     if (payment.status === "disputed") disputedCount++;
                     if (payment.status === "failed") failedCount++;
                     const formattedAmount = payment.amount
                        ? `₹${(payment.amount / 100).toFixed(2)}`
                        : "-";
   
                     const row = document.createElement("tr");
                     row.innerHTML = `
                   <td>${formattedAmount}</td>
                   <td>INR</td>
                   <td class="status my-4 ${payment.status}">${
                        payment.status
                           ? payment.status.charAt(0).toUpperCase() +
                             payment.status.slice(1)
                           : "-"
                     }</td>
                   <td>${payment.paymentMethod || "Visa **** 4242"}</td>
                   <td>${payment.description || "-"}</td>
                   <td>${payment.customer || "-"}</td>
                   <td>${
                      payment.date ? new Date(payment.date).toLocaleString() : "-"
                   }</td>
                   <td>${
                      payment.refundedDate
                         ? new Date(payment.refundedDate).toLocaleString()
                         : "-"
                   }</td>
               `;
                     tableBody.appendChild(row);
                  });
   
                  allBtn.innerHTML = `All <strong>${data.payments.length}</strong>`;
                  succeededBtn.innerHTML = `Succeeded <strong>${succeededCount}</strong>`;
                  refundedBtn.innerHTML = `Refunded <strong>${refundedCount}</strong>`;
                  disputedBtn.innerHTML = `Disputed <strong>${disputedCount}</strong>`;
                  failedBtn.innerHTML = `Failed <strong>${failedCount}</strong>`;
               } catch (error) {
                  console.error("Error fetching payment history:", error);
               }
            }
            fetchPaymentHistory();
         </script>
      </div>
      <script src="./static/js/coman/currentUser.js"></script>
      <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
   </body>
</html>
