<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>Profile — ShopEase Admin</title>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
         href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap"
         rel="stylesheet"
      />
      <link rel="stylesheet" href="./static/css/theme.css" />
   </head>

   <body>
      <div id="admin-header"></div>

      <div class="admin">
         <div id="admin-sidebar"></div>

         <main class="admin-main">
            <div class="head" style="padding-top: 0">
               <h1 class="head__title">Your profile</h1>
               <p class="head__sub">
                  Update your administrator name, email address and password.
               </p>
            </div>

            <div class="split" style="margin-top: 28px">
               <div class="card text-center">
                  <img class="avatar" src="./profile.jpg" alt="Profile picture" />
                  <p
                     style="
                        margin: 0 0 4px;
                        font-size: 18px;
                        font-weight: 600;
                        letter-spacing: -0.014em;
                     "
                     id="summaryName"
                  >
                     —
                  </p>
                  <p
                     class="muted"
                     style="margin: 0 0 12px; font-size: 14px"
                     id="summaryEmail"
                  >
                     —
                  </p>
                  <span class="badge badge--ok" id="profileRoleBadge">Admin</span>
               </div>

               <div class="card">
                  <div class="card__head">
                     <div>
                        <h2 class="card__title">Account details</h2>
                        <p class="card__sub">Your stored account information</p>
                     </div>
                  </div>

                  <div class="rows">
                     <div class="row">
                        <span class="row__key">Name</span>
                        <span class="row__val" id="profileName">—</span>
                     </div>
                     <div class="row">
                        <span class="row__key">Email</span>
                        <span class="row__val" id="profileEmail">—</span>
                     </div>
                     <div class="row">
                        <span class="row__key">Role</span>
                        <span class="row__val" id="profileRole">—</span>
                     </div>
                     <div class="row">
                        <span class="row__key">Password</span>
                        <span class="row__val">••••••••</span>
                     </div>
                  </div>

                  <div class="actions" style="margin-top: 20px">
                     <button
                        class="btn"
                        type="button"
                        data-open-modal="updateProfileModal"
                     >
                        Edit profile
                     </button>
                     <button
                        class="btn btn--ghost"
                        type="button"
                        data-open-modal="updatePasswordModal"
                     >
                        Change password
                     </button>
                  </div>
               </div>
            </div>
         </main>
      </div>

      <div class="modal" id="updateProfileModal">
         <div
            class="modal__panel"
            role="dialog"
            aria-modal="true"
            aria-label="Edit profile"
         >
            <div class="modal__head">
               <h2 class="modal__title">Edit profile</h2>
               <button
                  class="modal__close"
                  type="button"
                  data-close
                  aria-label="Close"
               >
                  &times;
               </button>
            </div>
            <form id="updateProfileForm" class="auth-form">
               <div class="field">
                  <label for="newName">Name</label>
                  <input type="text" id="newName" name="name" required />
               </div>
               <div class="field">
                  <label for="newEmail">Email</label>
                  <input type="email" id="newEmail" name="email" required />
               </div>
               <div class="modal__foot">
                  <button class="btn btn--ghost" type="button" data-close>
                     Cancel
                  </button>
                  <button class="btn" type="submit">Save changes</button>
               </div>
            </form>
         </div>
      </div>

      <div class="modal" id="updatePasswordModal">
         <div
            class="modal__panel"
            role="dialog"
            aria-modal="true"
            aria-label="Change password"
         >
            <div class="modal__head">
               <h2 class="modal__title">Change password</h2>
               <button
                  class="modal__close"
                  type="button"
                  data-close
                  aria-label="Close"
               >
                  &times;
               </button>
            </div>
            <form id="updatePasswordForm" class="auth-form">
               <div class="field">
                  <label for="oldPassword">Current password</label>
                  <input
                     type="password"
                     id="oldPassword"
                     name="oldPassword"
                     required
                  />
               </div>
               <div class="field">
                  <label for="newPassword">New password</label>
                  <input
                     type="password"
                     id="newPassword"
                     name="newPassword"
                     minlength="6"
                     required
                  />
               </div>
               <div class="modal__foot">
                  <button class="btn btn--ghost" type="button" data-close>
                     Cancel
                  </button>
                  <button class="btn" type="submit">Update password</button>
               </div>
            </form>
         </div>
      </div>

      <script src="./static/js/coman/api.js"></script>
      <script src="./static/js/coman/nav.js"></script>
      <script src="./static/js/coman/toast.js"></script>
      <script src="./static/js/coman/currentUser.js"></script>
      <script src="./static/js/coman/adminShell.js"></script>
      <script src="./static/js/users/profile.js"></script>
   </body>
</html>
